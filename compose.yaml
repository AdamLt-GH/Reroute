services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reroute
      POSTGRES_USER: reroute
      POSTGRES_PASSWORD: reroute
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      REROUTE_ENVIRONMENT: production
      REROUTE_DATABASE_URL: postgresql+asyncpg://reroute:reroute@postgres:5432/reroute
      REROUTE_FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-data:
